# Copyright and licence for files that cannot carry a header comment. Every
# other file states both in its first lines; scripts/check-copyright.sh
# enforces that in CI.
version = 1

[[annotations]]
path = ["Cargo.lock", "NOTICE", "shell/gnome/metadata.json", "docs/images/**"]
SPDX-FileCopyrightText = "2026 Kitefold Labs"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["crates/masthead-window/fonts/JetBrainsMono-*.ttf", "crates/masthead-window/fonts/OFL-JetBrainsMono.txt"]
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["crates/masthead-window/fonts/SpaceGrotesk-*.ttf", "crates/masthead-window/fonts/OFL-SpaceGrotesk.txt"]
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors"
SPDX-License-Identifier = "OFL-1.1"
