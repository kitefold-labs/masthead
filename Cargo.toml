[workspace]
resolver = "3"
members = [
    "crates/masthead-probe",
    "crates/masthead-core",
    "crates/masthead-api",
    "crates/masthead-daemon",
    "crates/masthead-bar",
    "crates/masthead-window",
    "crates/masthead-cosmic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/kitefold-labs/masthead"
homepage = "https://github.com/kitefold-labs/masthead"
authors = ["Kitefold Labs"]

[workspace.dependencies]
masthead-probe = { path = "crates/masthead-probe", version = "0.1.0" }
masthead-core = { path = "crates/masthead-core", version = "0.1.0" }
masthead-api = { path = "crates/masthead-api", version = "0.1.0" }
zbus = { version = "6.0", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1.54", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }
rustix = { version = "1.1", default-features = false, features = ["std"] }
libloading = "0.9"
log = { version = "0.4", features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
