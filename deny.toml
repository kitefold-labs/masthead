# cargo-deny: run `cargo deny check` locally; CI runs every check.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "aarch64-unknown-linux-gnu" }]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Apache-2.0-compatible licenses only. MPL-2.0 is file-level copyleft and is
# used by libcosmic and parts of its stack; it does not affect our sources.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "OFL-1.1",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/pop-os/libcosmic"]
